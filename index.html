<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLIXIO - Streaming de Filmes e Séries</title>
    <script>
        // Aplicar tema antes do paint para evitar FOUC
        (function() {
            var theme = localStorage.getItem('flixio_theme');
            if (!theme) {
                theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
            }
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <meta name="description" content="FLIXIO - Streaming de Filmes e Séries">
    <meta property="og:title" content="FLIXIO - Streaming de Filmes e Séries">
    <meta property="og:description" content="Descubra filmes e séries para assistir">
    <meta property="og:type" content="website">
    <meta property="og:image" content="favicon.svg">
    <meta name="theme-color" content="#141414">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div id="app"></div>
    <script type="module" src="app.js"></script>
    <script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js')</script>
</body>
</html>
